
services:
  # MongoDB database
  mongo:
    image: mongo:7.0
    container_name: paytrack-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: paytrack_db
    volumes:
      - mongo_data:/data/db
    networks:
      - paytrack-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: deewakarbhatia/paytrack-backend:latest
    container_name: paytrack-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/paytrack_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - paytrack-network

  # React frontend served by Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: deewakarbhatia/paytrack-frontend:latest
    container_name: paytrack-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - paytrack-network

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: paytrack-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - paytrack-network

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: paytrack-node-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9100:9100"
    networks:
      - paytrack-network

  # Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: paytrack-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - paytrack-network

  # Jenkins CI/CD
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: paytrack-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
    networks:
      - paytrack-network


volumes:
  mongo_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  jenkins_data:
    driver: local

networks:
  paytrack-network:
    driver: bridge
