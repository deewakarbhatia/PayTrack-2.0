# =========================================================================
# PayTrack 2.0 - Prometheus Configuration
# Syllabus Reference: Unit 6 & Practical 8 (Monitoring with Prometheus)
# =========================================================================

global:
  scrape_interval: 15s     # Scrape targets every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Host and System Metrics from Node Exporter (Practical 8)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. PayTrack 2.0 Backend Application Metrics (Custom Metrics: HTTP duration, status codes, active users)
  - job_name: 'paytrack-backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:5050']
